name: "提出 Bug / Bug Report"
description: "回報你遇到的問題 / Report an issue you encountered"
labels: ["bug"]
body:
  - type: input
    id: feature
    attributes:
      label: 發生問題的功能 / Affected Feature
      description: 請說明是哪個功能出了問題 / Which feature is affected?
      placeholder: "例如 e.g. 登入 Login、啟動遊戲 Launch Game、自動輸入密碼 Auto-fill Password..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟 / Steps to Reproduce
      description: 請描述如何重現這個問題 / Describe how to reproduce the issue
      placeholder: |
        1. 開啟程式 / Open the app
        2. 點擊 ... / Click ...
        3. 出現 ... / See ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 錯誤訊息或截圖 / Error Message or Screenshots
      description: 如果有錯誤訊息或截圖，請貼在這裡 / Paste any error messages or screenshots here
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 作業系統版本 / OS Version
      placeholder: "例如 e.g. Windows 10 22H2、Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 是否只有特定帳號 / 特定遊戲才會發生？ / Does it only happen with a specific account or game?
      options:
        - 所有帳號 / 遊戲都會發生 / Happens with all accounts/games
        - 只有特定帳號會發生 / Only with a specific account
        - 只有特定遊戲會發生 / Only with a specific game
        - 不確定 / Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 補充說明 / Additional Info
      description: 其他你覺得有幫助的資訊 / Any other information that might help
    validations:
      required: false
