name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (leave empty to auto-generate)'
        required: false
        default: ''
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
      version_increment:
        description: 'Version increment type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get Current Version from AssemblyInfo.cs
        id: get_current_version
        shell: pwsh
        run: |
          $assemblyInfoFile = Get-ChildItem -Path . -Filter "AssemblyInfo.cs" -Recurse | Select-Object -First 1
          
          if ($assemblyInfoFile) {
            $content = Get-Content $assemblyInfoFile.FullName -Raw
            
            if ($content -match 'AssemblyVersion\("(\d+)\.(\d+)\.\*"\)') {
              $currentMajor = [int]$matches[1]
              $currentMinor = [int]$matches[2]
              
              Write-Host "Current AssemblyVersion: $currentMajor.$currentMinor.*"
              echo "current_major=$currentMajor" >> $env:GITHUB_OUTPUT
              echo "current_minor=$currentMinor" >> $env:GITHUB_OUTPUT
              echo "current_version=$currentMajor.$currentMinor.*" >> $env:GITHUB_OUTPUT
              echo "found=true" >> $env:GITHUB_OUTPUT
            } else {
              Write-Host "Could not find AssemblyVersion with * pattern"
              echo "found=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Host "AssemblyInfo.cs not found"
            echo "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Get Patch from Latest Release Tag
        id: get_patch
        shell: pwsh
        run: |
          $currentPatch = 0
          try {
            git fetch --tags
            $tags = git tag -l "v*.*.*.*" --sort=-v:refname
            if ($tags) {
              $latestTag = ($tags -split "`n")[0].Trim()
              Write-Host "Latest tag: $latestTag"
              if ($latestTag -match '^v(\d+)\.(\d+)\.(\d+)\.') {
                $currentPatch = [int]$matches[3]
                Write-Host "Parsed patch from tag: $currentPatch"
              }
            } else {
              Write-Host "No matching tags found, starting patch at 0"
            }
          } catch {
            Write-Host "Error getting tags: $_"
          }
          echo "current_patch=$currentPatch" >> $env:GITHUB_OUTPUT

      - name: Update AssemblyInfo.cs for Release
        id: update_version
        shell: pwsh
        run: |
          $releaseType = "${{ github.event.inputs.release_type }}"
          $versionIncrement = "${{ github.event.inputs.version_increment }}"
          $currentMajor = [int]"${{ steps.get_current_version.outputs.current_major }}"
          $currentMinor = [int]"${{ steps.get_current_version.outputs.current_minor }}"
          $currentPatch = [int]"${{ steps.get_patch.outputs.current_patch }}"
          
          Write-Host "Current: $currentMajor.$currentMinor.$currentPatch"
          Write-Host "Mode: $releaseType, Increment: $versionIncrement"
          
          $newMajor = $currentMajor
          $newMinor = $currentMinor
          $newPatch = $currentPatch
          $versionChanged = $false
          
          if ($releaseType -eq 'release') {
            switch ($versionIncrement) {
              'major' {
                $newMajor = $currentMajor + 1
                $newMinor = 0
                $newPatch = 0
                $versionChanged = $true
              }
              'minor' {
                $newMinor = $currentMinor + 1
                $newPatch = 0
                $versionChanged = $true
              }
              'patch' {
                $newPatch = $currentPatch + 1
              }
            }
          } else {
            $newPatch = $currentPatch + 1
          }
          
          $newAssemblyVersion = "$newMajor.$newMinor.*"
          Write-Host "New version: $newMajor.$newMinor.$newPatch (AssemblyInfo: $newAssemblyVersion)"
          
          echo "new_major=$newMajor" >> $env:GITHUB_OUTPUT
          echo "new_minor=$newMinor" >> $env:GITHUB_OUTPUT
          echo "new_patch=$newPatch" >> $env:GITHUB_OUTPUT
          echo "new_version=$newAssemblyVersion" >> $env:GITHUB_OUTPUT
          echo "version_changed=$($versionChanged.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "semantic_version=$newMajor.$newMinor.$newPatch" >> $env:GITHUB_OUTPUT

      - name: Apply Version Update to AssemblyInfo.cs
        if: steps.update_version.outputs.version_changed == 'true'
        shell: pwsh
        run: |
          $assemblyInfoFile = Get-ChildItem -Path . -Filter "AssemblyInfo.cs" -Recurse | Select-Object -First 1
          $newAssemblyVersion = "${{ steps.update_version.outputs.new_version }}"
          
          Write-Host "Updating AssemblyInfo.cs to: $newAssemblyVersion"
          
          $content = Get-Content $assemblyInfoFile.FullName -Raw
          
          $content = $content -replace 'AssemblyVersion\("\d+\.\d+\.\*"\)', "AssemblyVersion(`"$newAssemblyVersion`")"
          
          $content | Set-Content $assemblyInfoFile.FullName -NoNewline
          
          Write-Host "Updated $($assemblyInfoFile.Name) to version $newAssemblyVersion"

      - name: Publish Application
        run: dotnet publish Beanfun/Beanfun.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Get Version from Compiled EXE and Convert to Timestamp
        id: get_exe_version
        shell: pwsh
        run: |
          $exePath = "publish/Beanfun.exe"
          
          if (Test-Path $exePath) {
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
            
            $major = $versionInfo.FileMajorPart
            $minor = $versionInfo.FileMinorPart
            $build = $versionInfo.FileBuildPart
            $revision = $versionInfo.FilePrivatePart
            
            Write-Host "Raw assembly version: $major.$minor.$build.$revision"
            
            # CRITICAL FIX: Ensure the base date is treated as UTC to match MS Compiler
            # Microsoft compiler uses UTC days since Jan 1, 2000
            $baseDate = (Get-Date -Year 2000 -Month 1 -Day 1 -Hour 0 -Minute 0 -Second 0).ToUniversalTime()
            $buildDate = $baseDate.AddDays($build)
            
            # Revision is seconds since midnight UTC / 2
            $secondsSinceMidnight = $revision * 2
            $buildDateTime = $buildDate.AddSeconds($secondsSinceMidnight)
            
            # Now buildDateTime is the exact time the compiler used
            $timestamp = $buildDateTime.ToString("yyMMddHHmm")
            
            Write-Host "Compiler Build DateTime (UTC): $($buildDateTime.ToString('yyyy-MM-dd HH:mm:ss'))"
            Write-Host "Formatted timestamp for Tag: $timestamp"
            
            $patch = "${{ steps.update_version.outputs.new_patch }}"
            $semanticVersion = "${{ steps.update_version.outputs.semantic_version }}"
            $tagVersion = "$major.$minor.$timestamp"
            $tagName = "v$tagVersion"
            
            Write-Host "Generated tag name: $tagName"
            
            echo "full_version=$major.$minor.$build.$revision" >> $env:GITHUB_OUTPUT
            echo "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT
            echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
            echo "major=$major" >> $env:GITHUB_OUTPUT
            echo "minor=$minor" >> $env:GITHUB_OUTPUT
            echo "patch=$patch" >> $env:GITHUB_OUTPUT
            echo "semantic_version=$semanticVersion" >> $env:GITHUB_OUTPUT
            echo "build=$build" >> $env:GITHUB_OUTPUT
            echo "revision=$revision" >> $env:GITHUB_OUTPUT
            echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
            echo "build_datetime=$($buildDateTime.ToString('yyyy-MM-dd HH:mm:ss'))" >> $env:GITHUB_OUTPUT
            
          } else {
            Write-Error "EXE file not found at $exePath"
            exit 1
          }

      - name: Check if Tag Exists
        id: check_tag
        shell: pwsh
        run: |
          $tag = "${{ steps.get_exe_version.outputs.tag_name }}"
          $repo = "${{ github.repository }}"
          
          Write-Host "Checking if tag '$tag' exists in repository '$repo'"
          
          $tagExists = $false
          try {
            $remoteTags = git ls-remote --tags origin
            if ($remoteTags -match "refs/tags/$tag$") {
              $tagExists = $true
              Write-Host "Tag found via git ls-remote: $tag"
            }
          } catch {
            Write-Host "Git ls-remote failed: $_"
          }
          
          if (-not $tagExists) {
            try {
              $apiUrl = "https://api.github.com/repos/$repo/git/refs/tags/$tag"
              $response = Invoke-RestMethod -Uri $apiUrl -Headers @{
                "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } -ErrorAction SilentlyContinue
              
              if ($response -and $response.ref) {
                $tagExists = $true
                Write-Host "Tag found via GitHub API: $tag"
              }
            } catch {
              if ($_.Exception.Response.StatusCode -eq 404) {
                Write-Host "Tag not found via GitHub API (404)"
              } else {
                Write-Host "GitHub API error: $_"
              }
            }
          }
          
          try {
            git fetch --tags
            $localTags = git tag -l
            if ($localTags -contains $tag) {
              $tagExists = $true
              Write-Host "Tag found locally: $tag"
            }
          } catch {
            Write-Host "Git fetch tags failed: $_"
          }
          
          if ($tagExists) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag exists - will skip release creation"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag does not exist - will create release"
          }
          
          Write-Host "Existing tags in repository:"
          git ls-remote --tags origin | ForEach-Object { Write-Host "  $_" }
    
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Last Release Tag (including prereleases)
        id: get_last_release
        shell: pwsh
        run: |
          try {
            $allReleases = gh api repos/${{ github.repository }}/releases --paginate 2>$null
            
            if ($allReleases) {
              $releases = $allReleases | ConvertFrom-Json
              
              if ($releases.Count -gt 0) {
                $latestRelease = $releases | Sort-Object -Property created_at -Descending | Select-Object -First 1
                
                $lastTag = $latestRelease.tag_name
                $lastReleaseName = $latestRelease.name
                $lastReleaseType = if ($latestRelease.prerelease) { "Pre-Release" } else { "Release" }
                $lastReleaseDate = $latestRelease.created_at
                
                Write-Host "Last release found:"
                Write-Host "  Tag: $lastTag"
                Write-Host "  Name: $lastReleaseName"
                Write-Host "  Type: $lastReleaseType"
                Write-Host "  Date: $lastReleaseDate"
                
                echo "last_tag=$lastTag" >> $env:GITHUB_OUTPUT
                echo "last_release_name=$lastReleaseName" >> $env:GITHUB_OUTPUT
                echo "last_release_type=$lastReleaseType" >> $env:GITHUB_OUTPUT
                echo "last_release_date=$lastReleaseDate" >> $env:GITHUB_OUTPUT
                echo "has_last_release=true" >> $env:GITHUB_OUTPUT
              } else {
                Write-Host "No releases found"
                echo "has_last_release=false" >> $env:GITHUB_OUTPUT
              }
            } else {
              Write-Host "No releases found"
              echo "has_last_release=false" >> $env:GITHUB_OUTPUT
            }
          } catch {
            Write-Host "Error getting releases: $_"
            echo "has_last_release=false" >> $env:GITHUB_OUTPUT
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Commits Since Last Release
        id: get_commits
        shell: pwsh
        run: |
          function Set-MultilineOutput($name, $value) {
            $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
            "$name<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $value | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          
          $hasLastRelease = "${{ steps.get_last_release.outputs.has_last_release }}" -eq 'true'
          $commitsList = @()
          $commitCount = 0
          
          $range = if ($hasLastRelease) {
            $lastTag = "${{ steps.get_last_release.outputs.last_tag }}"
            Write-Host "Getting commits since last release: $lastTag"
            git fetch --tags 2>$null
            "$lastTag..HEAD"
          } else {
            Write-Host "No previous release, getting last 30 commits"
            "-n 30"
          }
          
          try {
            $commits = git log $range --pretty=format:"%h|%s|%an|%ad" --date=short --no-merges
            
            if ($commits) {
              foreach ($commit in $commits) {
                $parts = $commit -split '\|', 4
                $hash = $parts[0]
                $message = if ($parts[1].Length -gt 80) { $parts[1].Substring(0, 77) + "..." } else { $parts[1] }
                $author = $parts[2]
                $date = $parts[3]
                
                $commitsList += "- [$hash] $message - $author ($date)"
                $commitCount++
              }
            }
          } catch {
            Write-Host "Error getting commits: $_"
          }
          
          $commitsText = if ($commitCount -gt 0) { $commitsList -join "`n" } else { "No commits found" }
          
          Set-MultilineOutput "commits_text" $commitsText
          echo "commit_count=$commitCount" >> $env:GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_exe_version.outputs.tag_name }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || format('{0} v{1}', github.event.inputs.release_type == 'release' && 'Release' || 'Pre-Release', steps.get_exe_version.outputs.semantic_version) }}
          body: |
            ## ${{ github.event.inputs.release_type == 'release' && 'Release' || 'Pre-Release' }} v${{ steps.get_exe_version.outputs.semantic_version }}
            
            ### Version Information
            - **Version:** ${{ steps.get_exe_version.outputs.semantic_version }}
            - **Full Build Version:** ${{ steps.get_exe_version.outputs.full_version }}
            - **Build Date/Time:** ${{ steps.get_exe_version.outputs.build_datetime }}
            - **Release Type:** ${{ github.event.inputs.release_type }}
            
            ---
            
            ### 📝 Commits in this Release
            ${{ steps.get_commits.outputs.commits_text }}
            
            **Total commits:** ${{ steps.get_commits.outputs.commit_count }}
            
            ---
            
            ### 🔧 Build Details
            - **Build Number (Days since 2000-01-01):** ${{ steps.get_exe_version.outputs.build }}
            - **Revision (Seconds since midnight / 2):** ${{ steps.get_exe_version.outputs.revision }}
            - **Actual Build Time:** ${{ steps.get_exe_version.outputs.build_datetime }}
            - **Git Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            
            ### 📦 Download
            - [Beanfun.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.get_exe_version.outputs.tag_name }}/Beanfun.exe)
            
            ### 🚀 Installation
            1. Download `Beanfun.exe`
            2. Run the executable
            ${{ github.event.inputs.release_type == 'prerelease' && '3. ⚠️ This is a pre-release version - use with caution' || '' }}
          files: publish/Beanfun.exe
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Skip Release (Tag Exists)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          Write-Host "${{ github.event.inputs.release_type }} already exists for tag ${{ steps.get_exe_version.outputs.tag_name }}"
          Write-Host "Skipping release creation"

      - name: Commit Version Change
        if: steps.update_version.outputs.version_changed == 'true' && steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          $assemblyInfoFile = Get-ChildItem -Path . -Filter "AssemblyInfo.cs" -Recurse | Select-Object -First 1
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $assemblyInfoFile.FullName
          git commit -m "Bump version to ${{ steps.update_version.outputs.semantic_version }} for release ${{ steps.get_exe_version.outputs.tag_name }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
