name: Lint, Format & Test

on:
  push:
    branches: [code]
  pull_request:
    branches: [code]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 'Frontend: ESLint / Prettier / TypeCheck / Vitest'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

  rust:
    name: 'Rust: fmt / Clippy / Test'
    runs-on: windows-latest
    # Cap the job at 25 min so a hung test (e.g. wiremock + tokio
    # paused-time interaction on Windows) fails loudly within the
    # next CI cycle instead of silently consuming the GitHub default
    # 6-hour budget. Healthy runs land in 4-8 min on a warm cache.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
